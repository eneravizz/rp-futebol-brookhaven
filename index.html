<!doctype html><html lang="pt-PT"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#5f172b"><title>RP de Futebol de Brookhaven</title><style>:root{font-family:Arial,sans-serif;color:#fff;background:#3d0d1c}*{box-sizing:border-box}body{margin:0}.app{min-height:100vh;padding:0 6%;background:radial-gradient(circle at 75% 0,#751f37,#300a17 75%);display:flex;flex-direction:column}.top{height:88px;border-bottom:1px solid #ffffff22;display:flex;align-items:center;justify-content:space-between}.brand{background:none;border:0;color:#fff;font-weight:800;font-size:18px;cursor:pointer}.gold{color:#e2b64d}.online{font-size:10px;letter-spacing:2px;color:#fffc}.hero{max-width:1400px;width:100%;margin:auto;padding:70px 0}.kicker{color:#e2b64d;letter-spacing:3px;font-size:11px;font-weight:bold}.hero h1{font-size:clamp(50px,8vw,110px);line-height:.86;margin:20px 0}.hero h1 span{color:#e2b64d}.intro{color:#ffffffb8;line-height:1.7;margin-bottom:55px}.label{font-size:10px;letter-spacing:2px;color:#ffffff88;margin-bottom:15px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{min-height:210px;border:1px solid #ffffff44;border-radius:8px;padding:24px;color:#fff;text-align:left;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;transition:.2s}.card:hover{transform:translateY(-5px);box-shadow:0 14px 30px #0005}.red{background:linear-gradient(135deg,#a52d49,#76152e)}.gold-card{background:linear-gradient(135deg,#e2b64d,#b97e1e);color:#37101d}.light{background:#faf8f2;color:#4b1124}.icon{font-size:32px}.card strong{font-size:clamp(23px,2.2vw,32px)}.card small{display:block;margin-top:7px;opacity:.75}.page{max-width:1000px;width:100%;margin:auto;padding:50px 0 70px}.back{background:none;border:0;color:#fffc;padding:8px 0;cursor:pointer}.page h2{font-size:clamp(50px,8vw,95px);line-height:.86;margin:50px 0 20px}.page p{color:#ffffffb8;line-height:1.7}.items{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:40px}.item{padding:24px;background:#ffffff12;border:1px solid #ffffff22;border-radius:8px}.item h3{font-size:25px;margin:15px 0 8px}.item p{font-size:13px;margin:0}.cta{margin-top:30px;padding:14px 18px;border:1px solid #e2b64d;border-radius:5px;color:#e2b64d;background:none;cursor:pointer}footer{border-top:1px solid #ffffff1a;padding:25px 0;display:flex;justify-content:space-between;color:#ffffff66;font-size:10px;letter-spacing:2px}@media(max-width:700px){.app{padding:0 18px}.top{height:72px}.online{font-size:8px}.hero{padding:55px 0}.hero h1{font-size:15vw}.cards,.items{grid-template-columns:1fr;gap:12px}.card{min-height:150px;padding:20px}.page{padding-top:30px}footer{font-size:8px;gap:15px}}
</style></head><body><div class="app"><header class="top"><button class="brand" onclick="home()">⚽ BRK<span class="gold">RP</span></button><span class="online">● COMUNIDADE ONLINE</span></header><main id="main"></main><footer><span>© 2024 BRKRP</span><span>FEITO PARA QUEM VIVE O JOGO</span></footer></div><script>const data={otm:{title:'OTM / CORPOS / FLAG',k:'GUIA DA COMUNIDADE',icon:'⚑',desc:'Tudo o que precisas para organizar o teu clube e representar a tua equipa dentro do RP.',items:[['OTM','Organiza treinos, jogos e momentos inesquecíveis para a tua equipa.'],['Corpos','Consulta os cargos e a hierarquia que dão vida ao teu clube.'],['Flags','Usa as flags certas e mantém o teu espaço com a identidade do clube.']]},idolos:{title:'ÍDOLOS DO RP',k:'HISTÓRIA DO RP',icon:'★',desc:'Conhece as lendas que marcaram a nossa comunidade e deixaram o seu nome na história.',items:[['As nossas lendas','Jogadores, capitães e personagens que inspiram cada nova época.'],['Momentos épicos','Revive as partidas e acontecimentos que nunca vamos esquecer.'],['O teu legado','Entra em campo, cria a tua história e torna-te o próximo ídolo.']]},qualidades:{title:'QUALIDADES DE ART META',k:'GUIA DE CRIAÇÃO',icon:'✦',desc:'Dicas simples para criares personagens, equipas e conteúdos incríveis para o teu RP.',items:[['Criatividade','Dá personalidade à tua personagem e surpreende dentro e fora do campo.'],['Fair play','Respeita os outros jogadores e ajuda a manter o RP divertido para todos.'],['Atitude','A melhor meta é aquela que cria histórias memoráveis para a comunidade.']]}};function home(){document.getElementById('main').innerHTML='<section class="hero"><div class="kicker">— BROOKHAVEN • FUTEBOL • ROLEPLAY</div><h1>RP DE FUTEBOL<br><span>DE BROOKHAVEN</span></h1><p class="intro">Entra em campo. Cria a tua história.<br>Vive o futebol como nunca.</p><div class="label">01 &nbsp; ESCOLHE O TEU CAMINHO</div><div class="cards"><button class="card red" onclick="show(\'otm\')"><span class="icon">⚑</span><span><strong>OTM / CORPOS / FLAG</strong><small>Explorar secção ↗</small></span></button><button class="card gold-card" onclick="show(\'idolos\')"><span class="icon">★</span><span><strong>ÍDOLOS DO RP</strong><small>Explorar secção ↗</small></span></button><button class="card light" onclick="show(\'qualidades\')"><span class="icon">✦</span><span><strong>QUALIDADES DE ART META</strong><small>Explorar secção ↗</small></span></button></div></section>'}function show(id){let x=data[id];document.getElementById('main').innerHTML='<section class="page"><button class="back" onclick="home()">← Voltar ao início</button><div class="kicker">'+x.icon+' &nbsp; '+x.k+'</div><h2 class="gold">'+x.title+'</h2><p>'+x.desc+'</p><div class="items">'+x.items.map((i,n)=>'<article class="item"><span class="gold">0'+(n+1)+'</span><h3>'+i[0]+'</h3><p>'+i[1]+'</p></article>').join('')+'</div><button class="cta" onclick="home()">Explorar outra secção →</button></section>'}home()</script></body></html>
